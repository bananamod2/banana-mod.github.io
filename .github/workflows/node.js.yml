name: Deploy Pages

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.x

      - name: Install dependencies and build site
        run: |
          npm i -g pnpm@7
          pnpm up
          pnpm i --shamefully-hoist
          pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: site-build
          path: ./build/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: 'https://penguinmod.site/project'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: site-build
          path: ./build/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
        with:
          # The deploy action automatically deploys contents from ./build
          # Make sure path exists and is not empty
